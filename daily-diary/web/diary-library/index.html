<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>我的日记</title><link rel="stylesheet" href="/diary/app.css"><script src="/diary/app.js" defer></script></head>
<body><aside class="sidebar"><a class="brand" href="/diary/"><span class="mark">日</span><span>我的日记<small>把每一天留在这里</small></span></a><div class="filters"><label class="search"><span>查找日记</span><input id="search" type="search" placeholder="日期、人物或关键词" autocomplete="off"></label><label class="month-label">月份<select id="month"><option value="">全部月份</option></select></label></div><div class="list-heading"><span>按日期阅读</span><span id="count"></span></div><nav id="days" aria-label="日记日期"></nav><div class="sidebar-foot">私人日记 · 仅本人可访问</div></aside>
<main><header class="toolbar"><button id="menu" aria-label="展开日期列表">日期列表</button><div class="crumb">日常记录 <span>/</span> <span id="crumb-date">正在载入</span></div><button id="refresh">刷新</button></header><div id="notice" role="status"></div><div class="paper-wrap"><section class="entry-head"><div><div class="eyebrow" id="weekday">DAILY JOURNAL</div><h1 id="date">我的日记</h1><span id="status" class="badge">载入中</span></div><div class="actions"><label class="version-label">版本<select id="versions" aria-label="选择日记版本"></select></label><a id="pdf-download" class="primary" target="_blank" rel="noopener">打开 PDF</a><a id="md-download" class="secondary">下载 Markdown</a></div></section><div class="view-tabs"><button class="active" data-view="read">阅读</button><button data-view="pdf">PDF 预览</button><span id="reading-note"></span></div><article id="article" class="prose"><p class="empty">正在整理你的日记列表……</p></article><iframe id="pdf-frame" title="日记PDF预览" hidden></iframe><div class="pager"><button id="older">较早一天</button><span id="position"></span><button id="newer">较晚一天</button></div></div></main></body></html>
